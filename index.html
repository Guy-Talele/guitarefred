<style>
:root {
  color-scheme: light;
  --fond: #eef1f7;
  --surface: #ffffff;
  --encre: #1c2140;
  --discret: #5d6585;
  --accent: #2e3a8c;
  --accent-doux: #dfe3f7;
  --grille: #c8ccee;
  --ligne: #d6daea;
  --erreur: #a3201a;
  --surbrillance: #fff3b0;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: #141829; --surface: #1e2338; --encre: #e6e8f4; --discret: #a3a9c6;
    --accent: #aab4ff; --accent-doux: #2c3360; --ligne: #333a5c; --erreur: #ff8a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: #141829; --surface: #1e2338; --encre: #e6e8f4; --discret: #a3a9c6;
  --accent: #aab4ff; --accent-doux: #2c3360; --ligne: #333a5c; --erreur: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 48rem) { html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 8.5rem); } }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font-family: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 17px; line-height: 1.45;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* barre de recherche, toujours visible */
.barre {
  position: relative; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--ligne);
  padding: .6rem 1rem .7rem;
  padding-left: calc(1rem + env(safe-area-inset-left, 0px)); padding-right: calc(1rem + env(safe-area-inset-right, 0px));
}
.barre-int { max-width: 64rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: .55rem; }
.instruments { display: flex; gap: .35rem; }
.instruments button {
  flex: 1; min-width: 0; border: 1.5px solid var(--ligne); background: transparent; border-radius: 999px;
  padding: .35rem .5rem; font-size: .95rem; min-height: 2.5rem;
}
.instruments button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.onglets { display: flex; gap: .9rem 1.1rem; border-bottom: 1px solid var(--ligne); overflow-x: auto; scrollbar-width: none; }
.onglets button { white-space: nowrap; }
.onglets button { border: 0; background: transparent; padding: .25rem 0 .45rem; color: var(--discret); border-bottom: 3px solid transparent; margin-bottom: -1px; min-height: 2.2rem; }
.onglets button[aria-selected="true"] { color: var(--encre); font-weight: 700; border-bottom-color: var(--accent); }
form.recherche { display: flex; gap: .5rem; }
form.recherche[hidden] { display: none; }
form.recherche input {
  flex: 1; min-width: 0; width: 100%; border: 1.5px solid var(--ligne); border-radius: .6rem; background: var(--fond);
  padding: .55rem .8rem; font-size: 1.15rem;
}
form.recherche button { border: 0; border-radius: .6rem; background: var(--accent); color: var(--surface); padding: 0 1.1rem; font-weight: 700; }

main { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 3rem; padding-left: calc(1rem + env(safe-area-inset-left, 0px)); padding-right: calc(1rem + env(safe-area-inset-right, 0px)); }
.accueil p { color: var(--discret); max-width: 36rem; }
.exemples { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }

/* en-tete de l'accord : l'element marquant de la page */
.accord-nom { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 700; line-height: 1.05; margin: .2rem 0 .5rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
.accord-nom .tel { font-size: .4em; font-weight: 400; color: var(--discret); vertical-align: .5em; margin-left: .35em; }
.pastilles { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
.pastille {
  width: 2.6rem; height: 2.6rem; border-radius: 50%; border: 2.5px solid currentColor; background: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 1rem;
}
.bloc { margin: 1.1rem 0; }
.bloc h2 { font-size: 1.05rem; margin: 0 0 .45rem; color: var(--discret); font-weight: 700; }
.liens { display: flex; flex-wrap: wrap; gap: .45rem; }
.lien {
  border: 1.5px solid var(--ligne); background: var(--surface); border-radius: .55rem;
  padding: .35rem .7rem; min-height: 2.6rem; text-align: left; line-height: 1.2;
}
.lien:hover { border-color: var(--accent); }
.lien small { display: block; color: var(--discret); font-size: .8rem; }
.lien.absent { opacity: .55; cursor: default; }
details.pli { border-top: 1px solid var(--ligne); padding: .6rem 0; }
details.pli > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 2.4rem; }
details.pli > summary::-webkit-details-marker { display: none; }
details.pli > summary::after { content: "+"; font-size: 1.4rem; color: var(--discret); }
details.pli[open] > summary::after { content: "−"; }
.modes { display: grid; gap: .5rem; margin-top: .4rem; }
.mode { background: var(--surface); border: 1px solid var(--ligne); border-radius: .6rem; padding: .55rem .7rem; display: grid; gap: .35rem; }
.mode .nom { font-weight: 700; overflow-wrap: anywhere; }
.mode .gamme { color: var(--discret); font-size: .88rem; overflow-wrap: anywhere; }
.mode .actions { display: flex; flex-wrap: wrap; gap: .4rem; }
.mode .actions button, .btn {
  border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: .5rem;
  padding: .3rem .7rem; min-height: 2.4rem; font-weight: 700;
}
.btn.plein { background: var(--accent); color: var(--surface); }
.reglages { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .6rem .9rem; margin-top: .5rem; }
.reglages label { display: flex; align-items: center; gap: .5rem; min-height: 2.4rem; }
.reglages select { border: 1.5px solid var(--ligne); border-radius: .45rem; background: var(--surface); padding: .25rem .4rem; }
.reglages input[type="checkbox"] { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); }
.reglages label.grise { opacity: .45; }

.entete-pos { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem; margin-top: 1.4rem; }
.entete-pos h2 { margin: 0; font-size: 1.25rem; }
.entete-pos label { display: flex; align-items: center; gap: .45rem; min-height: 2.4rem; }
.entete-pos input { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); }
.info { color: var(--discret); margin: .3rem 0 .7rem; }
.grille-diag { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem; }
.carte {
  position: relative; background: #fff; border-radius: .6rem; border: 2px solid transparent;
  box-shadow: 0 1px 0 var(--ligne); padding: 1.05rem 0 0; color: #1c2140;
}
.carte.fav { border-color: #e0a800; }
.carte > button.ouvrir { all: unset; display: block; width: 100%; cursor: pointer; border-radius: .5rem; }
.carte > button.ouvrir:focus-visible { outline: 3px solid var(--accent); }
.carte svg { width: 100%; height: auto; display: block; }
.etoile {
  position: absolute; top: 0; right: 0; width: 2.2rem; height: 1.6rem; border: 0; background: transparent; padding: 0;
  font-size: 1.15rem; line-height: 1; color: #b58900;
}
.plus { display: block; margin: 1rem auto 0; }
.legende { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .6rem; color: var(--discret); font-size: .9rem; margin: -.3rem 0 .7rem; }
.pastille-corde { display: inline-block; width: 1.4rem; height: .55rem; border-radius: .3rem; margin-right: .2rem; vertical-align: middle; }
.carte.cible { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.position-cases { display: flex; flex-wrap: wrap; gap: .45rem; align-items: flex-end; margin-top: .5rem; }
.position-cases label { display: grid; justify-items: center; gap: .15rem; font-weight: 700; color: var(--discret); }
.position-cases select { border: 1.5px solid var(--ligne); border-radius: .45rem; background: var(--surface); padding: .3rem .2rem; min-width: 3.1rem; min-height: 2.4rem; text-align: center; }
.encadre { background: var(--surface); border: 1px solid var(--ligne); border-left: 4px solid var(--accent); border-radius: .6rem; padding: .7rem .9rem; margin: .4rem 0 1rem; display: grid; gap: .45rem; }
.encadre .ligne-sym { font-size: 1.15rem; font-weight: 700; }
.encadre p { margin: 0; }
.encadre.alerte { border-left-color: var(--erreur); color: var(--encre); margin: 0 0 1rem; }
.encadre .discret { color: var(--discret); font-size: .92rem; }
.encadre .explication { background: var(--accent-doux); border-radius: .45rem; padding: .45rem .6rem; font-size: .95rem; }
.formulaire-base { display: grid; gap: .6rem; margin-bottom: 1rem; }
.formulaire-base .rangee { display: flex; flex-wrap: wrap; gap: .5rem; }
.formulaire-base input { flex: 1 1 12rem; min-width: 0; border: 1.5px solid var(--ligne); border-radius: .6rem; background: var(--surface); padding: .55rem .8rem; font-size: 1.15rem; }
.formulaire-base select { border: 1.5px solid var(--ligne); border-radius: .6rem; background: var(--surface); padding: .45rem .5rem; }
.gamme { border-top: 1px solid var(--ligne); padding: .7rem 0; }
.gamme h2 { font-size: 1.05rem; margin: 0 0 .45rem; }
.choix-ton { display: flex; align-items: center; gap: .5rem; min-height: 2.4rem; margin-bottom: .4rem; }
.choix-ton select { border: 1.5px solid var(--ligne); border-radius: .45rem; background: var(--surface); padding: .3rem .4rem; }
.harmo-choix { display: grid; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); gap: .5rem .9rem; margin-bottom: .6rem; }
.harmo-choix label { display: grid; gap: .2rem; font-weight: 700; color: var(--discret); font-size: .9rem; }
.harmo-choix select { font: inherit; font-weight: 400; color: var(--encre); border: 1.5px solid var(--ligne); border-radius: .45rem; background: var(--surface); padding: .35rem .4rem; min-height: 2.4rem; }
.degre { background: var(--surface); border: 1px solid var(--ligne); border-radius: .7rem; padding: .7rem .9rem; margin: .7rem 0; }
.degre h3 { margin: 0 0 .5rem; font-size: 1.1rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { min-width: 2.7rem; height: 2.7rem; border-radius: 999px; border: 2.5px solid var(--c); background: #fff; color: var(--c); font-weight: 700; font-size: 1rem; opacity: .55; }
.chip.on { background: var(--c); color: #fff; opacity: 1; }
.nom-accord { margin: .55rem 0; }
.nom-accord small { color: var(--discret); }
.btn.petit { min-height: 2rem; padding: .15rem .6rem; font-size: .9rem; margin-left: .3rem; }
.resto { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.resto label { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.resto select { font: inherit; border: 1.5px solid var(--ligne); border-radius: .45rem; background: var(--surface); padding: .3rem .4rem; min-height: 2.4rem; }
.cadre-h { overflow-x: auto; background: var(--surface); border: 1px solid var(--ligne); border-radius: .6rem; }
.table-harmo { border-collapse: collapse; width: 100%; font-size: .92rem; }
.table-harmo th, .table-harmo td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid var(--ligne); white-space: nowrap; }
.grille-harmo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
@media (min-width: 48rem) { .grille-harmo { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.carte-harmo { margin: 0; background: #fff; color: #1c2140; border-radius: .6rem; padding: .4rem; cursor: pointer; }
.carte-harmo figcaption { font-size: .85rem; margin-bottom: .3rem; }
.carte-harmo svg { width: 100%; height: auto; display: block; }
.renv-base { background: var(--surface); border: 1px solid var(--ligne); border-radius: .6rem; padding: .7rem .9rem; margin-bottom: .6rem; display: grid; gap: .4rem; }
.renv-base h3 { margin: 0; font-size: 1.05rem; }
.renv-base .pastilles { margin: 0; }
.renv-base .pastille { width: 2.2rem; height: 2.2rem; font-size: .88rem; }
.etat { display: inline-block; align-self: center; border-radius: 999px; padding: .05rem .6rem; font-size: .85rem; font-weight: 700; border: 1.5px solid currentColor; }
.etat.ok { color: #2e7d32; } .etat.corr { color: #b26a00; } .etat.abs { color: var(--erreur); }
.vide { color: var(--erreur); font-weight: 700; margin: .6rem 0; }
.message { color: var(--erreur); }

dialog {
  border: 0; border-radius: .9rem; padding: 0; width: min(28rem, 94vw); max-height: 92vh;
  background: var(--surface); color: var(--encre); box-shadow: 0 10px 40px rgba(10, 14, 40, .35);
}
dialog::backdrop { background: rgba(14, 18, 40, .55); }
.dlg-tete { padding: 1rem 1.1rem .4rem; }
.dlg-tete h3 { margin: 0; font-size: 1.45rem; line-height: 1.15; overflow-wrap: anywhere; }
.dlg-tete p { margin: .25rem 0 0; color: var(--discret); font-size: .92rem; }
.dlg-corps { padding: .3rem 1.1rem; overflow: auto; max-height: 64vh; }
.dlg-corps .papier { background: #fff; border-radius: .6rem; padding: .4rem; }
.dlg-corps svg { width: 100%; height: auto; display: block; }
.dlg-pied { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: flex-end; padding: .7rem 1.1rem 1rem; }
footer { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1rem 2.5rem; color: var(--discret); font-size: .92rem; border-top: 1px solid var(--ligne); }
footer .liens { margin-top: .5rem; }
.chargement { padding: 3rem 1rem; text-align: center; color: var(--discret); }
@media (min-width: 48rem) {
  .barre { position: sticky; top: env(safe-area-inset-top, 0px); }
  .grille-diag { grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .6rem; }
  .carte { padding-top: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="barre">

    <div class="onglets" role="tablist" aria-label="Vue">

      <button type="button" role="tab" data-vue="gammes" aria-selected="false">Gammes</button>
      <button type="button" role="tab" data-vue="harmo" aria-selected="false">Harmonisation</button>

<main id="main"><div class="chargement" id="chargement">Préparation des 612 955 positions…</div></main>
<footer>

  <div class="liens">

</footer>
<dialog id="dlg"><div class="dlg-tete"><h3 id="dlg-titre"></h3><p id="dlg-sous"></p></div><div class="dlg-corps" id="dlg-corps"></div><div class="dlg-pied" id="dlg-pied"></div></dialog>

    const m = sym.trim().match(/^([A-Ga-g][#b]?)([^/]*)(?:\/([A-Ga-g][#b]?))?$/);
    if (!m) throw new Error('symbole illisible : ' + sym);
    let [, racine, q, basse] = m;
    racine = racine[0].toUpperCase() + racine.slice(1);
    q = q.trim();
    if (!has(QUALITES, q)) {
      const q2 = q.replace(/[()]/g, '');
      if (has(QUALITES, q2)) q = q2;
      else throw new Error('qualité inconnue « ' + q + ' » dans ' + sym);
    }
    const r = classe(racine);
    const pcs = QUALITES[q].map((i) => mod12(r + i));
    const b = basse ? classe(basse) : r;
    if (!pcs.includes(b)) pcs.push(b);
    if (basse) basse = basse[0].toUpperCase() + basse.slice(1);
    return { racine, q, basse: basse || null, pcs: [...new Set(pcs)], b, r };
  }

  function parseIntervalles(texte) {
    const toks = texte.trim().split(/[,\s;]+/).filter(Boolean);
    const vals = [];
    for (const t of toks) {
      const k = has(ALIAS_INT, t) ? t : t.toLowerCase();
      if (!has(ALIAS_INT, k)) throw new Error('intervalle inconnu : ' + t);
      vals.push(ALIAS_INT[k]);
    }
    if (!vals.includes(0)) vals.unshift(0);
    return [...new Set(vals)];
  }

  // nom complet selon les regles de Base.txt (meme logique que nommer_selon_base)
  function nommerSelonBase(semis) {
    const S = new Set(semis.map(mod12)); S.add(0);
    const alts = [], nos = [], rem = [];
    const a3M = S.has(4), a3m = S.has(3), diese9 = a3M && a3m;
    let sus = '', pris9 = false, pris4 = false, qual = '';
    if (a3M) qual = '';
    else if (a3m) qual = 'm';
    else if (S.has(2) && S.has(5)) { sus = 'sus2sus4'; pris9 = true; pris4 = true; }
    else if (S.has(2)) { sus = 'sus2'; pris9 = true; }
    else if (S.has(5)) { sus = 'sus4'; pris4 = true; }
    else nos.push('no3');
    const b9 = S.has(1);
    const t9 = S.has(2) && !pris9, t11 = S.has(5) && !pris4, t13 = S.has(9);
    const s7 = S.has(10), s7M = S.has(11);
    if (b9) alts.push('b9');
    if (diese9) alts.push('#9');
    const q5 = S.has(7), qb5 = S.has(6), qd5 = S.has(8);
    const addsQuinte = [];
    if (q5) { if (qb5) addsQuinte.push([6, 'add b5']); if (qd5) addsQuinte.push([8, 'add 5#']); }
    else if (qb5 && qd5) alts.push('b5', 'add 5#');
    else if (qb5) alts.push('b5');
    else if (qd5) alts.push('#5');
    else nos.push('no5');
    const neufLa = t9 || pris9, onzeLa = t11 || pris4;
    const ext = [];
    let radical;
    if (s7 || s7M) {
      if (s7 && s7M) {
        radical = qual + '7/maj7';
        if (t9) ext.push([2, 'add9']);
        if (t11) ext.push([5, 'add11']);
        if (t13) ext.push([9, 'add13']);
        if (ext.length) rem.push('radical 7/maj7 : extensions écrites en add');
      } else {
        const base = t13 ? 13 : t11 ? 11 : t9 ? 9 : 7;
        radical = s7M ? (qual === 'm' ? 'm(maj' + base + ')' : 'maj' + base) : qual + base;
        if (base >= 11 && !neufLa) nos.push('no9');
        if (base >= 13 && !onzeLa) nos.push('no11');
        if (t13) rem.push("6te avec 7e lue comme 13e (option a) ; l'exemple 7(b9)sus4(add6) de Base.txt dit add6");
      }
    } else if (t13) {
      radical = qual + (t9 ? '6/9' : '6');
      if (t11) ext.push([5, 'add11']);
    } else {
      radical = qual;
      if (t9) ext.push([2, 'add9']);
      if (t11) ext.push([5, 'add11']);
    }
    const adds = ext.concat(addsQuinte).sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0)).map((x) => x[1]);
    const ordreNo = { no3: 0, no5: 1, no9: 2, no11: 3 };
    nos.sort((a, b) => ordreNo[a] - ordreNo[b]);
    if ((radical === '' || radical === 'm') && sus) { radical += sus; sus = ''; }
    let nom = radical;
    if (alts.length) nom += '(' + alts.join(', ') + ')';
    nom += sus;
    if (adds.length) nom += '(' + adds.join(', ') + ')';
    if (nos.length) nom += '(' + nos.join(', ') + ')';
    return { nom: nom || 'maj', remarques: rem };
  }
  const FRETTES_TYPE = 20;

  function classe(n) {
    let v = NOTE[n[0].toUpperCase()];
    for (const c of n.slice(1)) v += c === '#' ? 1 : -1;
    return ((v % 12) + 12) % 12;
  }
  const mod12 = (x) => ((x % 12) + 12) % 12;
  const normItem = (s) => (s || '').split(' ').join('').trim();
  const cleMode = (s) => s.replace(/\s+/g, '').toLowerCase();
  function cleDe(semis) {
    return [...new Set(semis.map(mod12))].sort((a, b) => a - b).map((i) => INTERVALLES[i]).join(' ');
  }
  function triNaturel(a, b) {
    const ka = a.split(/(\d+)/), kb = b.split(/(\d+)/);
    for (let i = 0; i < Math.min(ka.length, kb.length); i++) {
      const x = i % 2 ? parseInt(ka[i], 10) : ka[i].toLowerCase();
      const y = i % 2 ? parseInt(kb[i], 10) : kb[i].toLowerCase();
      if (x < y) return -1;
      if (x > y) return 1;
    }
    return ka.length - kb.length;
  }
  function cleTri(f) {
    const j = f.filter((x) => x !== 'x' && x !== '0').map(Number);
    const jouees = j.length ? j : [0];
    const mx = Math.max(...jouees), mn = Math.min(...jouees);
    return [mx, mx - mn, f.filter((x) => x === 'x').length];
  }
  function comparerTri(a, b) {
    const ka = cleTri(a), kb = cleTri(b);
    for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return 0;
  }
  function formeInstrument(f, A) {
    if (A.cordes.length === 6) return f;
    for (let i = 0; i < CORDES_ABSENTES; i++) if (f[i] !== 'x') return null;
    return f.slice(CORDES_ABSENTES);

  function normaliser(f) {

    return [f.map((x) => (x === 'x' ? 'x' : String(Number(x) - d))), d];
  }

  class Moteur {
    constructor(donnees, octets) {
      this.items = donnees.items.map(([item, page, semis, tel], i) =>
        ({ i, item, page, semis, tel, notes: semis.map((s) => INTERVALLES[s]).join(' ') }));
      this.parItem = new Map(); this.parNotes = new Map();
      for (const r of this.items) {
        if (!this.parItem.has(normItem(r.item))) this.parItem.set(normItem(r.item), r);

      this.groupes = new Map();
      const g = donnees.groupes;
      let debut = 0;
      for (let k = 0; k < g.length; k += 3) {
        this.groupes.set(g[k] + '|' + g[k + 1], [debut, g[k + 2]]);
        debut += g[k + 2];
      }
      this.mega = donnees.mega.entrees.map(([d, fichier, it, arobase]) =>
        ({ dossier: donnees.mega.dossiers[d], fichier, item: it, arobase: !!arobase }));
      this.modesZic = donnees.modes;
      this.couleurs = donnees.couleurs || {};
    }

    chercherItem(s) {
      const r = this.parItem.get(normItem(s));
      if (r) return r;
      const c = this.items.filter((x) => normItem(x.item).toLowerCase() === normItem(s).toLowerCase());
      return c.length === 1 ? c[0] : null;
    }

    // positions de l'index (formes de guitare) pour un accord et une basse donnes
    formesGroupe(itemIdx, basseGuitare) {
      const g = this.groupes.get(itemIdx + '|' + basseGuitare);
      if (!g) return [];
      const out = [];
      for (let k = g[0]; k < g[0] + g[1]; k++) {
        const f = [];
        for (let c = 0; c < 6; c++) { const v = this.octets[k * 6 + c]; f.push(v === 255 ? 'x' : String(v)); }
        out.push(f);
      }
      return out;
    }

    renversements(semis, racine) {
      const out = [];
      for (const d of semis.slice(1)) {
        const t = this.parNotes.get(cleDe(semis.map((x) => x - d)));
        out.push({ basse: racine ? NOMS_NOTES[mod12(classe(racine) + d)] : '[' + INTERVALLES[d] + ']', accord: t || null });
      }
      return out;
    }

    variantes(r) {
      const ints = r.notes.split(' ');
      const v = [];
      if (ints.length > 3) {
        if (ints.includes('5')) v.push(['Sans quinte', ints.filter((i) => i !== '5')]);
        if (ints.includes('3m') || ints.includes('3M')) v.push(['Sans tierce', ints.filter((i) => i !== '3m' && i !== '3M')]);
      }
      if (ints.length > 4 && ints.includes('5') && (ints.includes('3m') || ints.includes('3M')))
        v.push(['Sans quinte ni tierce', ints.filter((i) => !['5', '3m', '3M'].includes(i))]);
      return v.map(([lab, l]) => ({ label: lab, notes: l.join(' '), accord: this.parNotes.get(l.join(' ')) || null }));
    }

    modes(itemIdx) {
      return this.mega.filter((e) => e.item === itemIdx)
        .map((e, k) => [e, k]).sort((a, b) => triNaturel(a[0].dossier, b[0].dossier) || a[1] - b[1]).map((x) => x[0]);
    }

    notesMode(dossier, fichier, tonique) {
      const nom = fichier.replace(/\.[^.]*$/, '').replace(/^\s*\d+_/, '');
      const ivs = this.modesZic[cleMode(nom)];
      let rel;
      if (ivs) rel = ivs;
      else {
        const s = new Set();
        for (const e of this.mega) if (e.dossier === dossier && e.fichier === fichier) this.items[e.item].semis.forEach((x) => s.add(x));
        rel = [...s];
      }
      return { pcs: [...new Set(rel)].sort((a, b) => a - b).map((i) => mod12(tonique + i)), source: ivs ? 'zicscale' : 'Mega_Base' };
    }

    positions(r, racine, accordage, o) {
      const A = ACCORDAGES[accordage];
      const semis = r.semis;
      const sansBasse = o.sansBasse && semis.length < 5;
      const classes = semis.map((d) => mod12(classe(racine) + d));
      const avecRenv = sansBasse || A.renversements;
      let formes = [];
      const vues = new Set();
      for (const bas of (avecRenv ? classes : classes.slice(0, 1))) {
        let it;
        if (bas === classes[0]) it = r;
        else { it = this.parNotes.get(cleDe(classes.map((c) => c - bas))); if (!it) continue; }
        for (const f of this.formesGroupe(it.i, mod12(bas - A.decalage))) {
          const fi = formeInstrument(f, A);
          if (fi && !vues.has(fi.join(' '))) { vues.add(fi.join(' ')); formes.push(fi); }
        }
      }
      formes.sort(comparerTri);
      const total = formes.length;
      if (o.fretteMax != null) formes = formes.filter((f) => Math.max(0, ...f.filter((x) => x !== 'x').map(Number)) <= o.fretteMax);
      if (o.fretteMin != null) formes = formes.filter((f) => f.every((x) => x === 'x' || x === '0' || Number(x) >= o.fretteMin));
      if (o.sansEtouffee) formes = formes.filter((f) => !f.includes('x'));
      if (o.sansVide) formes = formes.filter((f) => !f.includes('0'));
      else if (o.avecVide) formes = formes.filter((f) => f.includes('0'));      // au moins une corde a vide
      const k = Math.max(0, A.cordes.length - semis.length);
      if (sansBasse && !A.renversements) formes = formes.filter((f) => f.slice(0, k).every((x) => x === 'x'));
      return { formes, total };
    }

    generiques(r, accordage, o) {
      const A = ACCORDAGES[accordage];
      const semis = r.semis;
      const sansBasse = o.sansBasse && semis.length < 5;
      const avecRenv = sansBasse || A.renversements;
      const k = Math.max(0, A.cordes.length - semis.length);
      const vues = new Map();
      for (let racine = 0; racine < 12; racine++) {
        const classes = semis.map((d) => mod12(racine + d));
        for (const bas of (avecRenv ? classes : classes.slice(0, 1))) {
          let it;
          if (bas === classes[0]) it = r;
          else { it = this.parNotes.get(cleDe(classes.map((c) => c - bas))); if (!it) continue; }
          for (const f of this.formesGroupe(it.i, mod12(bas - A.decalage))) {
            const fi = formeInstrument(f, A);
            if (!fi || fi.includes('0') || fi.every((x) => x === 'x')) continue;
            if (o.sansEtouffee && fi.includes('x')) continue;
            if (sansBasse && !A.renversements && !fi.slice(0, k).every((x) => x === 'x')) continue;
            const [g, d] = normaliser(fi);
            const cle = g.join(' ');
            if (!vues.has(cle)) vues.set(cle, { forme: g, racine: mod12(racine - d) });
          }
        }
      }
      return [...vues.values()].sort((a, b) => comparerTri(a.forme, b.forme));
    }

    // traduction d'un symbole : accord complet, puis simplifie (regle des plus de 4 notes)
    traduire(sym) {
      const a = analyserSymbole(sym);
      const nomBasse = a.basse || a.racine;
      const semis = a.pcs.map((p) => mod12(p - a.b));
      const cle = cleDe(semis);
      const res = { symbole: sym, racine: a.racine, nomBasse, cle, nbNotes: new Set(a.pcs).size,
        accord: this.parNotes.get(cle) || null, simplifie: null, remarque: null };
      const quinte = mod12(a.r + 7);
      if (new Set(a.pcs).size > 4 && a.pcs.includes(quinte)) {
        if (quinte === a.b) res.remarque = 'plus de 4 notes, mais la quinte est à la basse : rien à retirer';
        else {
          const cle2 = cleDe(a.pcs.filter((p) => p !== quinte).map((p) => p - a.b));
          res.simplifie = { cle: cle2, accord: this.parNotes.get(cle2) || null,
            note: 'quinte de ' + a.racine + ' (' + NOMS_NOTES[quinte] + ') retirée' };
        }

      res.simplifieBasse = null;
      const quinteB = mod12(a.b + 7);
      if (new Set(a.pcs).size > 4 && a.b !== a.r && a.pcs.includes(quinteB)) {
        const cle3 = cleDe(a.pcs.filter((p) => p !== quinteB).map((p) => p - a.b));
        res.simplifieBasse = { cle: cle3, accord: this.parNotes.get(cle3) || null,
          note: 'quinte de ' + nomBasse + ' (' + NOMS_NOTES[quinteB] + ') retirée' };
        res.explication = 'Plus de 4 notes, basse ' + nomBasse + ' ≠ fondamentale ' + a.racine + ' : 1 retire la quinte de ' + a.racine +
          ' (lecture du symbole), 2 celle de ' + nomBasse + ' (accord joué, lu depuis la basse).';
      }
      return res;
    }

    // commande Base : l'accord et chacun de ses renversements, nommes selon Base.txt et compares au CSV
    base(texte) {
      const vals = parseIntervalles(texte);
      return vals.map((v, k) => {
        const semis = vals.map((x) => x - v);
        const cle = cleDe(semis);
        const { nom, remarques } = nommerSelonBase(semis);
        const actuel = this.parNotes.get(cle) || null;
        const etat = actuel && normItem(actuel.item) === normItem(nom) ? 'conforme' : (actuel ? 'À CORRIGER' : 'absent du CSV');
        return { k, decalage: mod12(v), basse: INTERVALLES[mod12(v)], cle, propose: nom, actuel, etat, remarques };
      });
    }

    // position jouee (frettes du grave a l'aigu) : notes, accord lu depuis la basse, presence dans l'index
    position(frettes, accordage) {
      const A = ACCORDAGES[accordage];
      const jeu = frettes.slice(-A.cordes.length).map((f) => {
        const t = String(f).trim().toLowerCase();
        if (t === 'x') return 'x';
        if (!/^\d+$/.test(t)) throw new Error('Valeurs attendues : x ou un numéro de case.');
        return String(parseInt(t, 10));
      });
      const notes = [];
      jeu.forEach((f, i) => { if (f !== 'x') notes.push(A.midi[i] + Number(f)); });
      const res = { jeu, notes: notes.map((n) => NOMS_NOTES[mod12(n)]), basse: null, cle: null, accord: null, dansIndex: false, racine: null };
      if (!notes.length) return res;
      res.basse = NOMS_NOTES[mod12(notes[0])];
      res.cle = cleDe(notes.map((n) => n - notes[0]));
      res.accord = this.parNotes.get(res.cle) || null;
      const guitare = Array(6 - jeu.length).fill('x').concat(jeu);
      res.dansIndex = this.dansIndex(guitare);
      res.retenu = res.accord ? { pc: mod12(notes[0]), accord: res.accord } : null;
      if (A.renversements) {
        // au ukulele, pas de corde grave : toutes les lectures de ses notes, et celle au nom le plus simple
        res.lectures = [];
        for (const n of notes) {
          const pc = mod12(n);
          const t = this.parNotes.get(cleDe(notes.map((x) => x - pc)));
          if (t && !res.lectures.some((l) => l.pc === pc)) res.lectures.push({ pc, accord: t, nom: NOMS_INDEX[pc].split(' ')[0] });
        }
        if (res.lectures.length)
          res.retenu = res.lectures.reduce((m, l) => (normItem(l.accord.item).length < normItem(m.accord.item).length ? l : m));
      }
      if (res.dansIndex && res.retenu) res.racine = NOMS_INDEX[res.retenu.pc].split(' ')[0];
      return res;
    }

    codeForme(f) { let c = 0; for (const x of f) c = c * 32 + (x === 'x' ? 31 : Math.min(30, Number(x))); return c; }
    dansIndex(f) {
      if (!this.codes) {
        const n = this.octets.length / 6, codes = new Uint32Array(n);
        for (let k = 0; k < n; k++) {
          let c = 0;
          for (let j = 0; j < 6; j++) { const v = this.octets[k * 6 + j]; c = c * 32 + (v === 255 ? 31 : Math.min(30, v)); }
          codes[k] = c;

        codes.sort();
        this.codes = codes;
      }
      const c = this.codeForme(f);
      let lo = 0, hi = this.codes.length - 1;
      while (lo <= hi) { const mi = (lo + hi) >> 1; if (this.codes[mi] === c) return true; if (this.codes[mi] < c) lo = mi + 1; else hi = mi - 1; }

      if (m && !this.parItem.get(normItem(item)) && this.chercherItem(m[2])) { racine = m[1]; item = m[2]; }
      const r = this.chercherItem(item);
      return r ? { r, racine } : null;
    }

    // intervalle de chaque corde (null = etouffee), pour les pastilles des diagrammes
    etiquettes(f, accordage, classeRacine) {
      const A = ACCORDAGES[accordage];
      return f.map((x, i) => (x === 'x' ? null : INTERVALLES[mod12(A.midi[i] + Number(x) - classeRacine)]));
    }
    notesForme(f, accordage) {
      const A = ACCORDAGES[accordage];
      return f.map((x, i) => (x === 'x' ? null : NOMS_NOTES[mod12(A.midi[i] + Number(x))])).filter(Boolean);
    }
  }

  const exports = { Moteur, INTERVALLES, NOMS_NOTES, ACCORDAGES, FRETTES_TYPE, QUALITES, classe, cleDe, cleMode, normItem, triNaturel, mod12,
    analyserSymbole, parseIntervalles, nommerSelonBase };
  if (typeof module !== 'undefined' && module.exports) module.exports = exports;
  else racineGlobale.GFMoteur = exports;
})(typeof window !== 'undefined' ? window : globalThis);

const aujourdhui = () => new Date().toISOString().slice(0, 10);

// au ukulele, pas de corde grave : un accord et ses renversements ne font qu'un, les favoris se reconnaissent a leurs notes
function notesAccord(racinePc, intervalles) { return new Set(intervalles.split(' ').map((i) => mod12(racinePc + INTERVALLES.indexOf(i)))); }
function notesFav(x) { try { return notesAccord(G.classe(x.fondamentale), x.intervalles || ''); } catch (e) { return null; } }

function favDe(acc, racinePc, intervalles) {

}

  if (present && !deja.length)
    favoris.favoris.push({ instrument: acc, fondamentale: NOMS_NOTES[mod12(racinePc)], intervalles, nom, forme, ajoute: horodatage() });

// Regles entre instruments : guitalele <-> guitare (ajout et retrait ; la guitare joue l'accord une quarte plus bas) ;

function ukuleleDe(racineUk, intervalles, forme) {

  const uk = f.slice(2), U = ACCORDAGES.ukulele;

function cascade(acc, racinePc, intervalles, forme, ajout) {

  else if (acc === 'guitare') { out.push(['guitalele', mod12(racinePc + 5), forme]); rUk = mod12(racinePc + 5); }

// Accords sans basse : la forme (cordes graves en trop etouffees) vaut pour l'accord et pour ses renversements
function estSansBasse(acc, intervalles, forme) {
  const f = (forme || '').split(' '), k = 6 - (intervalles || '').split(' ').length;

function familleInv(rc, intervalles) {           // renversements presents dans la base : [classe, intervalles, nom]
  if (!M) return [];
  const classes = intervalles.split(' ').map((i) => mod12(rc + INTERVALLES.indexOf(i)));

  for (const b of classes.slice(1)) {

// index des favoris (une cle par favori) : les verifications restent rapides avec des dizaines de milliers de favoris
function cleIndex(instr, pc, intervalles, forme) {

function indexFavoris() {

function completerRenversements() {

    let rc; try { rc = G.classe(x.fondamentale); } catch (e) { continue; }
    for (const [b, iv, nom] of familleInv(rc, x.intervalles)) {
      const k = cleIndex(x.instrument, b, iv, x.forme);
      if (!idx.has(k)) {
        favoris.favoris.push({ instrument: x.instrument, fondamentale: NOMS_NOTES[b], intervalles: iv, nom, forme: x.forme, ajoute: x.ajoute || horodatage() });

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function svgPastille(x, y, r, iv, fond, ep) {
  const c = COUL[iv] || '#333';

    `<text x="${x}" y="${y}" fill="${c}" font-size="${r * (iv.length > 1 ? 0.78 : 0.95)}" font-weight="700" text-anchor="middle" dominant-baseline="central">${esc(iv)}</text>`;

// grille d'accord : sa couleur dit sur quelle corde est la note la plus grave jouee. En position fondamentale, c'est
// la corde de la tonique ; pour un accord sans basse (x x 9 9 9 11), c'est celle de sa basse, comme x x 2 4 4 4.
const COUL_CORDE_TONIQUE = { 6: '#9fa8da', 5: '#ef9a9a', 4: '#80cbc4', 3: '#e6b86a', 2: '#b39ddb', 1: '#90a4ae' };

function cordeTonique(forme) {
  const i = forme.findIndex((x) => x !== 'x');
  return i < 0 ? null : forme.length - i;               // numero usuel : 6 = la plus grave d'un instrument a 6 cordes
}
function texteCorde(forme, acc, racinePc) {
  const ct = cordeTonique(forme), i = forme.findIndex((x) => x !== 'x');
  if (!ct) return '';
  return M.etiquettes(forme, acc, racinePc)[i] === 'F' ? ` · tonique sur la ${NOM_CORDE[ct]}` : ` · sans basse, corde la plus grave : ${NOM_CORDE[ct].replace(' corde', '')}`;
}
function svgDiagramme(forme, acc, racinePc, generique, largeur = 160) {
  const n = forme.length;
  const ct = cordeTonique(forme), GRILLE = COUL_CORDE_TONIQUE[ct] || '#c8c8c8';
  const app = forme.filter((x) => x !== 'x' && x !== '0').map(Number);
  const haut = app.length ? Math.max(...app) : 0, bas = app.length ? Math.min(...app) : 1;
  const debut = generique ? 1 : (haut <= 5 ? 1 : bas);
  const nb = Math.max(5, app.length ? haut - debut + 1 : 5);
  const ex = largeur / (n - 1 + 0.42 * 2.75 + 0.42 * 1.15), ey = ex * 1.15, r = ex * 0.42;
  const mg = r * 2.75, y0 = r * 2.6;
  const lab = M.etiquettes(forme, acc, racinePc);
  let s = '';
  for (let k = 0; k <= nb; k++) s += `<line x1="${mg}" y1="${y0 + k * ey}" x2="${mg + ex * (n - 1)}" y2="${y0 + k * ey}" stroke="${GRILLE}" stroke-width="1.6"/>`;
  if (!generique) {
    if (debut === 1) s += `<line x1="${mg}" y1="${y0}" x2="${mg + ex * (n - 1)}" y2="${y0}" stroke="${SILLET}" stroke-width="${Math.max(3, r * 0.35)}"/>`;
    else s += `<text x="${mg - r * 1.3}" y="${y0 + ey * 0.5}" font-size="${r * 0.95}" font-weight="700" fill="#333" text-anchor="end" dominant-baseline="central">${debut}</text>`;
  }
  for (let i = 0; i < n; i++) { const x = mg + i * ex; s += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0 + nb * ey}" stroke="${GRILLE}" stroke-width="1.6"/>`; }

    if (lab[i] == null) s += `<text x="${x}" y="${y0 - r * 1.25}" font-size="${r * 1.05}" fill="#555" text-anchor="middle" dominant-baseline="central">x</text>`;
    else if (v === '0') s += svgPastille(x, y0 - r * 1.25, r * 0.85, lab[i]);

  return `<svg xmlns="http://www.w3.org/2000/svg" font-family="'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif" viewBox="0 0 ${largeur} ${h + r * 1.6}" role="img" aria-label="Position ${esc(forme.join(' '))}">${s}</svg>`;

function svgManche(pcs, tonique, acc, accord, nbFrettes, generique = false) {

  nbFrettes = nbFrettes || A.frettesCarte;

// ---------------------------------------------------------------- recherche et affichage
const main = () => document.getElementById('main');
function rechercher(saisie) {
  saisie = (saisie || '').trim();
  document.getElementById('saisie').value = saisie;
  if (etat.vue !== 'accords') basculerVue('accords', false);
  if (!saisie) return accueil();
  ecrire('gf.derniere', saisie);
  const a = M.analyser(saisie);                                    // 1) nom de la base, avec ou sans fondamentale
  if (a) return montrer(Object.assign(a, { entete: '', cible: null }));
  const toks = saisie.split(/[\s,]+/).filter(Boolean);
  const n = ACCORDAGES[etat.acc].cordes.length;
  if (toks.length === n && toks.every((t) => /^(x|\d+)$/i.test(t))) return chercherPosition(toks);   // 2) frettes tapees
  const trads = [], erreurs = [];                                   // 3) symboles a traduire
  for (const t of toks) { try { trads.push(M.traduire(t)); } catch (e) { erreurs.push([t, e.message]); } }
  const entete = blocTraductions(trads, erreurs);
  if (!trads.length) {
    etat.res = null;
    main().innerHTML = blocPosition() + `<p class="message">« ${esc(saisie)} » : ni nom d’accord de la base, ni symbole lisible, ni position (${n} cases pour le ${esc(ACCORDAGES[etat.acc].court.toLowerCase())}).</p>
      <p><button type="button" class="btn" data-versbase="">Trouver le nom d’après les intervalles (Base)</button></p>`;
    return;
  }
  if (toks.length === 1 && trads[0].accord) return montrer({ r: trads[0].accord, racine: trads[0].nomBasse, entete, cible: null });
  etat.res = null;
  main().innerHTML = blocPosition() + entete;
}

function montrer(res) { etat.res = res; etat.lot = 1; etat.favSeul = !res.cible; afficher(); window.scrollTo({ top: 0 }); }
function blocTraductions(trads, erreurs) {

    const nom = accord ? `<button type="button" class="lien" data-cherche="${esc(nomBasse + ' ' + accord.item)}">${esc(nomBasse + ' ' + accord.item)}<small>{${esc(accord.tel)}}</small></button>`
      : `<span class="lien absent">${esc(nomBasse)}<small>absent de la base</small></span>`;
    const renv = accord ? M.renversements(cle.split(' ').map((i) => INTERVALLES.indexOf(i)), nomBasse) : [];
    return `<p class="discret">${lib} (${cle.split(' ').length} notes) : ${esc(cle)}</p><div class="liens">${nom}${renv.map((x) => lienAccord(x.accord, x.basse, true)).join('')}</div>`;
  };
  let h = '';
  for (const t of trads) {
    h += `<div class="encadre"><div class="ligne-sym">${esc(t.symbole)}</div>${ligne('Complet', t.cle, t.accord, t.nomBasse)}`;
    if (t.simplifieBasse) {                     // symbole a basse : les deux lectures, au choix
      h += `<p class="explication">${esc(t.explication)}</p>`;
      if (t.simplifie) h += ligne('Simplifié 1, ' + t.simplifie.note, t.simplifie.cle, t.simplifie.accord, t.nomBasse);
      else h += `<p class="discret">Simplifié 1 : ${esc(t.remarque || 'pas de quinte juste de ' + t.racine + ' à retirer')}</p>`;
      h += ligne('Simplifié 2, ' + t.simplifieBasse.note, t.simplifieBasse.cle, t.simplifieBasse.accord, t.nomBasse);
    } else if (t.simplifie) h += ligne('Simplifié, ' + t.simplifie.note, t.simplifie.cle, t.simplifie.accord, t.nomBasse);
    else if (t.remarque) h += `<p class="discret">${esc(t.remarque)}</p>`;
    h += '</div>';
  }
  for (const [t, e] of erreurs) h += `<p class="message">${esc(t)} : ${esc(e)}</p>`;
  if (erreurs.length) h += '<p><button type="button" class="btn" data-versbase="">Trouver le nom d’après les intervalles (Base)</button></p>';
  return h;
}
function chercherPosition(frettes) {

function nomPng(...parties) {
  return parties.filter(Boolean).join(' ').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_').replace(/_+/g, '_') + '.png';

async function pngDe(titre, sous, svg) {
  const L = 1080, marge = 54, img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
  const larg = Math.min(L - 2 * marge, Number(vb[1]) * 3), haut = larg * Number(vb[2]) / Number(vb[1]);
  const c = document.createElement('canvas'), x = c.getContext('2d');
  const police = "'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif";
  const couper = (texte, taille, gras) => {                   // retour a la ligne selon la largeur
    x.font = `${gras ? 700 : 400} ${taille}px ${police}`;
    const lignes = [];
    for (const para of String(texte).split('\n')) {
      let cur = '';
      for (const mot of para.split(' ')) {
        const essai = cur ? cur + ' ' + mot : mot;
        if (cur && x.measureText(essai).width > L - 2 * marge) { lignes.push(cur); cur = mot; } else cur = essai;
      }
      lignes.push(cur);
    }
    return lignes;
  };
  const lt = couper(titre, 52, true), ls = couper(sous, 30, false);
  const tete = marge + lt.length * 62 + 12 + ls.length * 40 + 30;
  c.width = L; c.height = Math.ceil(tete + haut + marge);
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
  let y = marge + 46;
  x.fillStyle = '#1a237e'; x.font = `700 52px ${police}`;
  for (const l of lt) { x.fillText(l, marge, y); y += 62; }
  y += 6; x.fillStyle = '#444b6e'; x.font = `400 30px ${police}`;
  for (const l of ls) { x.fillText(l, marge, y); y += 40; }
  x.drawImage(img, (L - larg) / 2, tete, larg, haut);
  return new Promise((ok) => c.toBlob(ok, 'image/png'));
}
async function telechargerPng(titre, sous, svg, nom) {
  try {
    const blob = await pngDe(titre, sous, svg);
    const fichier = new File([blob], nom, { type: 'image/png' });
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (ios && navigator.canShare && navigator.canShare({ files: [fichier] })) {   // iPhone : « Enregistrer l'image »
      await navigator.share({ files: [fichier], title: titre });
      return;
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    if (e && e.name !== 'AbortError') alert('Image non créée : ' + e.message);
  }
}

async function imageSvg(svg) { const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await i.decode(); return i; }
async function planchePng(titre, sous, ivs, cartes) {
  const L = 1080, marge = 44, ecart = 18, par = 3, police = "'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif";
  const cell = (L - 2 * marge - (par - 1) * ecart) / par;

    const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);

  }

  const c = document.createElement('canvas'), x = c.getContext('2d');
  c.width = L; c.height = Math.ceil(tete + hauteurs.reduce((s, h) => s + h + ecart, 0) + marge);

  x.fillStyle = '#1a237e'; x.font = `700 50px ${police}`; x.fillText(titre, marge, marge + 46);
  x.fillStyle = '#444b6e'; x.font = `400 28px ${police}`; x.fillText(sous, marge, marge + 92);
  let px = marge;                                         // intervalles de l'accord, en pastilles de couleur
  for (const iv of ivs) {
    const coul = COUL[iv] || '#333', r = 26, cy = marge + 92 + 46;
    x.beginPath(); x.arc(px + r, cy, r, 0, 2 * Math.PI); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 4; x.strokeStyle = coul; x.stroke();
    x.fillStyle = coul; x.font = `700 ${iv.length > 1 ? 22 : 26}px ${police}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(iv, px + r, cy + 1); x.textAlign = 'start'; x.textBaseline = 'alphabetic';
    px += 2 * r + 12;
  }
  let y = tete;
  rangs.forEach((rang, i) => {
    rang.forEach((im, j) => {
      const cx = marge + j * (cell + ecart);
      x.strokeStyle = '#d6daea'; x.lineWidth = 2; x.strokeRect(cx, y, cell, hauteurs[i]);
      x.drawImage(im.img, cx + 10, y + 10, cell - 20, im.h);

}

      ? new Response(f.stream().pipeThrough(new DecompressionStream('gzip'))).text() : f.text();
    lireTexte(t.files[0]).then((txt) => {
      const d = JSON.parse(txt);
      const cles = new Set(favoris.favoris.map((x) => [x.instrument, x.fondamentale, x.intervalles, x.forme].join('|')));
      let ajout = 0;
      for (const x of d.favoris || []) {
        const c = [x.instrument, x.fondamentale, x.intervalles, x.forme].join('|');
        if (!cles.has(c) && x.intervalles && x.forme) { favoris.favoris.push(x); cles.add(c); ajout++; }
      }
      ajout += completerJumeaux();
      enregistrerFavoris(); if (etat.res) afficher();
      alert(ajout + ' favori(s) importé(s).');
    }).catch(() => alert('Ce fichier n’est pas un favoris.json lisible.'));
    t.value = '';
    return;
  }
  if (t.dataset.f) {
    const f = etat.filtres;
    if (t.type === 'checkbox') f[t.dataset.f] = t.checked;
    else f[t.dataset.f] = t.value === '' ? null : Number(t.value);
    majGrisage();                       // « Sans corde a vide » et « Corde(s) a vide » s'excluent
    ecrire('gf.filtres', f); etat.lot = 1; afficherPositions();
  }
});
document.getElementById('form').addEventListener('submit', (ev) => { ev.preventDefault(); rechercher(document.getElementById('saisie').value); });
document.addEventListener('submit', (ev) => {
  if (ev.target.id !== 'form-base') return;
  ev.preventDefault();
  etat.base = { texte: document.getElementById('saisie-base').value.trim(), racine: document.getElementById('racine-base').value };
  vueBase();
});
document.addEventListener('toggle', (ev) => { if (ev.target.id === 'pli-position') etat.posOuvert = ev.target.open; }, true);

// ---------------------------------------------------------------- chargement des donnees
async function degonfler(b64) {
  const bin = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  if (typeof DecompressionStream !== 'undefined') {
    const flux = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(flux).arrayBuffer());
  }
  await new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; s.onload = ok; s.onerror = ko; document.head.appendChild(s); });
  return window.pako.ungzip(bin);
}
async function demarrer(donnees) {
  try {
    const octets = await degonfler(donnees.formes);
    M = new G.Moteur(donnees, octets);
    DONNEES = donnees;
    if (completerRenversements() + completerJumeaux()) { sauverFavoris(); majNbFav(); }
    COUL = Object.assign({}, COUL_DEFAUT, M.couleurs);
    majInstruments(); majNbFav();
    const derniere = lire('gf.derniere', '');
    if (derniere) rechercher(derniere); else accueil();
  } catch (e) {
    main().innerHTML = `<p class="message">Les données n’ont pas pu être chargées (${esc(e.message)}). Recharge la page ; si le problème persiste, utilise un navigateur à jour.</p>`;
  }
}
// ---------------------------------------------------------------- Google Drive (version en ligne)
// Donnees et favoris dans le Drive de Fred, dossier « GuitareFred » cree par la page :
//   GuitareFred/REFERENCE/donnees_web.json   (produit par GuitareFred sur PC : Reglages > Preparer les donnees de la page web)
//   GuitareFred/FAVORIS/favoris.json         (+ sauvegardes/favoris_AAAA-MM-JJ.json, 60 jours)
// Permission demandee : drive.file (la page ne voit que les fichiers qu'elle a crees).
window.GFDrive = (function () {
  const CLIENT_ID = '453935473376-9ov00lk3mtgujs1fjdg48ar412olhhtf.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const API = 'https://www.googleapis.com/drive/v3/files', UP = 'https://www.googleapis.com/upload/drive/v3/files';
  const SAUVEGARDES = 60, GARDE_RETRAITS_JOURS = 180;
  let jeton = null, expire = 0, client = null, ids = null, minuterie = null, derniereSync = null, message = '', infoRef = '', occupe = false;
  let modifie = !!lire('gf.drive.modifie', false);   // des changements locaux attendent d'etre envoyes
  const configure = () => CLIENT_ID && !CLIENT_ID.startsWith('/*');

  // ---------- connexion Google
  function chargerGoogle() {
    return new Promise((ok, ko) => {
      if (window.google && google.accounts && google.accounts.oauth2) return ok();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = () => ko(new Error('Google injoignable'));
      document.head.appendChild(s);
    });
  }
  async function connecter() {
    if (!configure()) return;
    await chargerGoogle();
    if (!client) {
      client = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: (r) => {
          if (r && r.access_token) {
            jeton = r.access_token; expire = Date.now() + ((r.expires_in || 3600) - 60) * 1000;
            ecrire('gf.drive.connu', true); message = '';
            apresConnexion();
          } else { message = 'Connexion refusée.'; afficherEtat(); }
        },
      });
    }
    client.requestAccessToken({ prompt: lire('gf.drive.connu', false) ? '' : 'consent' });
  }
  const connecte = () => jeton && Date.now() < expire;

  // ---------- appels a l'API du Drive
  async function appel(url, opts = {}) {
    if (!connecte()) { jeton = null; afficherEtat(); throw new Error('connexion'); }
    const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + jeton }, opts.headers || {}) }));
    if (r.status === 401) { jeton = null; afficherEtat(); throw new Error('connexion'); }
    if (!r.ok) throw new Error('Drive ' + r.status);
    return r;
  }
  async function lister(q, ordre) {
    const u = API + '?q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent('files(id,name,modifiedTime)') +
      '&pageSize=200&spaces=drive' + (ordre ? '&orderBy=' + encodeURIComponent(ordre) : '');
    return (await (await appel(u)).json()).files || [];
  }
  async function dossier(role, parent, nom) {
    const f = await lister(`appProperties has { key='gf' and value='${role}' } and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    if (f.length) return f[0].id;
    const meta = { name: nom, mimeType: 'application/vnd.google-apps.folder', appProperties: { gf: role } };
    if (parent) meta.parents = [parent];
    return (await (await appel(API + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) })).json()).id;
  }
  async function dossiers() {
    if (ids) return ids;
    const racine = await dossier('racine', null, 'GuitareFred');
    const reference = await dossier('reference', racine, 'REFERENCE');
    const fav = await dossier('favoris', racine, 'FAVORIS');
    const sauvegardes = await dossier('sauvegardes', fav, 'sauvegardes');
    return (ids = { racine, reference, favoris: fav, sauvegardes });
  }
  async function fichier(nom, parent) {
    const f = await lister(`name='${nom}' and '${parent}' in parents and trashed=false`);
    return f[0] || null;
  }
  async function creer(nom, parent, texte) {
    const b = 'gf' + Math.random().toString(36).slice(2);
    const corps = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: nom, parents: [parent] })}\r\n` +
      `--${b}\r\nContent-Type: application/json\r\n\r\n${texte}\r\n--${b}--`;
    return (await appel(UP + '?uploadType=multipart&fields=id,modifiedTime', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: corps })).json();
  }
  async function remplacer(id, texte) {
    return (await appel(UP + '/' + id + '?uploadType=media&fields=id,modifiedTime', { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: texte })).json();
  }
  const lireFichier = async (id) => (await appel(API + '/' + id + '?alt=media')).text();
  const lireOctets = async (id) => new Uint8Array(await (await appel(API + '/' + id + '?alt=media')).arrayBuffer());
  async function pako() {
    if (!window.pako) await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
    return window.pako;
  }
  async function compresser(texte) {           // le fichier des favoris passe de ~2,3 Mo a ~100 Ko
    if (typeof CompressionStream === 'undefined') return (await pako()).gzip(texte);
    return new Uint8Array(await new Response(new Blob([texte]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  }
  async function decompresser(octets) {
    if (typeof DecompressionStream === 'undefined') return (await pako()).ungzip(octets, { to: 'string' });
    return new Response(new Blob([octets]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  async function creerBinaire(nom, parent, octets) {
    const b = 'gf' + Math.random().toString(36).slice(2);
    const corps = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: nom, parents: [parent] })}\r\n` +
      `--${b}\r\nContent-Type: application/gzip\r\n\r\n`, octets, `\r\n--${b}--`]);
    return (await appel(UP + '?uploadType=multipart&fields=id,modifiedTime', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body: corps })).json();
  }
  async function remplacerBinaire(id, octets) {
    return (await appel(UP + '/' + id + '?uploadType=media&fields=id,modifiedTime', { method: 'PATCH', headers: { 'Content-Type': 'application/gzip' }, body: new Blob([octets]) })).json();
  }
  async function copier(id, nom, parent) {     // copie faite par le Drive lui-meme : rien a transferer
    return (await appel(API + '/' + id + '/copy?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: nom, parents: [parent] }) })).json();
  }

  // ---------- favoris : fusion entre appareils (le plus recent l'emporte, ajout comme retrait)
  const cle = (x) => [x.instrument, x.fondamentale, x.intervalles, x.forme].join('|');
  function fusionner(a, b) {
    const ev = new Map();
    const noter = (x, type, t) => { const k = cle(x), c = ev.get(k); if (!c || t > c.t) ev.set(k, { t, type, x }); };
    for (const s of [a, b]) {
      for (const x of s.favoris || []) noter(x, 'a', x.ajoute || '');
      for (const x of s.retires || []) noter(x, 'r', x.retire || '');
    }
    const limite = new Date(Date.now() - GARDE_RETRAITS_JOURS * 864e5).toISOString();
    const vals = [...ev.values()];
    return { version: 2, favoris: vals.filter((e) => e.type === 'a').map((e) => e.x),
      retires: vals.filter((e) => e.type === 'r' && e.t >= limite).map((e) => e.x) };
  }
  const cles = (o) => new Set([...(o.favoris || []).map(cle), ...(o.retires || []).map((x) => 'r|' + cle(x) + '|' + x.retire)]);
  const memes = (a, b) => { const x = cles(a), y = cles(b); return x.size === y.size && [...x].every((k) => y.has(k)); };
  let encore = false;                        // une demande arrivee pendant une synchronisation : on la refait ensuite
  async function synchroniser() {
    if (!connecte()) return;
    if (occupe) { encore = true; return; }
    occupe = true; message = 'Synchronisation…'; afficherEtat();
    try {
      const d = await dossiers();
      const f = await fichier('favoris.json.gz', d.favoris);
      const ancien = await fichier('favoris.json', d.favoris);       // ancienne version non compressee : reprise puis supprimee
      let distant = { favoris: [], retires: [] }, relu = false;
      if (f && f.modifiedTime !== lire('gf.drive.favmod', null)) {   // un autre appareil a ecrit depuis : on relit
        message = 'Synchronisation : lecture du Drive…'; afficherEtat();
        distant = JSON.parse(await decompresser(await lireOctets(f.id)));
        relu = true;
      }
      let fusion = fusionner(favoris, distant);
      if (ancien) fusion = fusionner(fusion, JSON.parse(await lireFichier(ancien.id) || '{}'));
      favoris.favoris = fusion.favoris; favoris.retires = fusion.retires; favoris.version = 2;
      completerRenversements(); completerJumeaux();         // renversements des formes sans basse, paires guitalele / guitare
      sauverFavoris(); majNbFav();
      if (!f || ancien || modifie || (relu && !memes(favoris, distant))) {
        if (f) {
          const nomS = 'favoris_' + aujourdhui() + '.json.gz';
          if (!(await fichier(nomS, d.sauvegardes))) {        // une sauvegarde par jour, avant la premiere ecriture
            await copier(f.id, nomS, d.sauvegardes);
            const toutes = await lister(`'${d.sauvegardes}' in parents and trashed=false`, 'name desc');
            for (const vieille of toutes.slice(SAUVEGARDES)) await appel(API + '/' + vieille.id, { method: 'DELETE' });
          }
        }
        message = 'Synchronisation : envoi…'; afficherEtat();
        const octets = await compresser(JSON.stringify(favoris));
        const r = f ? await remplacerBinaire(f.id, octets) : await creerBinaire('favoris.json.gz', d.favoris, octets);
        ecrire('gf.drive.favmod', r.modifiedTime);
        if (ancien) await appel(API + '/' + ancien.id, { method: 'DELETE' });
      } else if (relu) ecrire('gf.drive.favmod', f.modifiedTime);
      modifie = false; ecrire('gf.drive.modifie', false);
      derniereSync = new Date(); message = '';
      if (etat.res && etat.vue === 'accords') afficherPositions();
    } catch (e) { message = e.message === 'connexion' ? 'Reconnexion nécessaire.' : 'Synchronisation impossible (' + e.message + ').'; }
    occupe = false; afficherEtat();
    if (encore) { encore = false; setTimeout(synchroniser, 200); }
  }
  function planifier() { modifie = true; ecrire('gf.drive.modifie', true); if (!connecte()) return; clearTimeout(minuterie); minuterie = setTimeout(synchroniser, 1500); }

  // ---------- reference : donnees_web.json
  function valider(d) { if (!d || !Array.isArray(d.items) || !Array.isArray(d.groupes) || typeof d.formes !== 'string') throw new Error('ce fichier n’est pas un donnees_web.json'); }
  async function verifierReference() {
    const d = await dossiers();
    const f = await fichier('donnees_web.json', d.reference);
    if (!f) { if (!M) ecranAccueilDrive('Le Drive ne contient pas encore de données. Sur le PC, choisis « Mettre à jour la référence » et le fichier donnees_web.json préparé par GuitareFred.'); return; }
    const meta = await idbLire('ref-meta');
    if (meta && meta.modifiedTime >= f.modifiedTime && M) return;
    message = 'Chargement de la référence…'; afficherEtat();
    const texte = await lireFichier(f.id);
    const donnees = JSON.parse(texte); valider(donnees);
    await idbEcrire('ref', texte); await idbEcrire('ref-meta', { modifiedTime: f.modifiedTime });
    await demarrer(donnees);
    message = ''; infoRef = (meta ? 'Référence mise à jour depuis le Drive : ' : 'Référence chargée : ') + donnees.items.length + ' accords.'; afficherEtat();
  }
  async function deposerReference(fichierLocal) {
    try {
      const texte = await fichierLocal.text();
      const donnees = JSON.parse(texte); valider(donnees);
      message = 'Envoi de la référence…'; afficherEtat();
      const d = await dossiers();
      const f = await fichier('donnees_web.json', d.reference);
      const r = f ? await remplacer(f.id, texte) : await creer('donnees_web.json', d.reference, texte);
      await idbEcrire('ref', texte); await idbEcrire('ref-meta', { modifiedTime: r.modifiedTime });
      await demarrer(donnees);
      message = ''; infoRef = 'Référence déposée dans le Drive : ' + donnees.items.length + ' accords.';
    } catch (e) { message = 'Référence non déposée (' + e.message + ').'; }
    afficherEtat();
  }

  async function apresConnexion() {
    afficherEtat();
    try { await verifierReference(); } catch (e) { message = 'Drive : ' + e.message; }
    await synchroniser();
  }

  // ---------- affichage
  function ecranAccueilDrive(texte) {
    main().innerHTML = `<section class="accueil"><h1 class="accord-nom">GuitareFred</h1><p>${esc(texte)}</p>
      ${connecte() ? '' : '<p><button type="button" class="btn plein" data-drive="connecter">Se connecter à Google Drive</button></p>'}</section>`;
  }
  function afficherEtat() {
    const z = document.getElementById('drive');
    if (!z) return;
    if (!configure()) { z.innerHTML = '<p class="discret">Drive : identifiant Google à renseigner dans la page.</p>'; return; }
    const heure = derniereSync ? derniereSync.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : null;
    z.innerHTML = connecte()
      ? `<p>Drive : connecté${heure ? ', favoris synchronisés à ' + heure : ''}.${message ? ' ' + esc(message) : ''}${infoRef ? ' ' + esc(infoRef) : ''}</p>
         <div class="liens"><button class="btn" type="button" data-drive="synchroniser">Synchroniser</button>
         <button class="btn" type="button" data-drive="reference">Mettre à jour la référence</button>
         <input type="file" id="fichier-ref" accept=".json,application/json" hidden></div>`
      : `<p>Drive : non connecté.${message ? ' ' + esc(message) : ''}</p>
         <div class="liens"><button class="btn plein" type="button" data-drive="connecter">Se connecter à Google Drive</button></div>`;
  }
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-drive]');
    if (!t) return;
    const a = t.dataset.drive;
    if (a === 'connecter') connecter().catch((e) => { message = e.message; afficherEtat(); });
    else if (a === 'synchroniser') (async () => {      // la reference du Drive d'abord, puis les favoris
      try { await verifierReference(); } catch (e) { message = 'Drive : ' + e.message; }
      await synchroniser();
    })();
    else if (a === 'reference') document.getElementById('fichier-ref').click();
  });
  document.addEventListener('change', (ev) => { if (ev.target.id === 'fichier-ref' && ev.target.files[0]) { deposerReference(ev.target.files[0]); ev.target.value = ''; } });

  async function demarrerDrive() {
    afficherEtat();
    let texte = null;
    try { texte = await idbLire('ref'); } catch (e) { /* IndexedDB indisponible */ }
    if (texte) return demarrer(JSON.parse(texte));                  // donnees deja sur l'appareil : utilisables hors connexion
    ecranAccueilDrive(configure() ? 'Connecte-toi à Google Drive pour charger tes données et tes favoris.'
      : 'La connexion au Drive n’est pas encore configurée.');
  }
  return { demarrer: demarrerDrive, planifier, fusionner, synchroniser, _etat: () => ({ jeton, ids }) };
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

(async () => {
  await chargerFavoris();
  const brut = document.getElementById('donnees').textContent.trim();
  if (brut && brut[0] === '{') return demarrer(JSON.parse(brut));       // prototype : donnees integrees a la page
  if (window.GFDrive) return window.GFDrive.demarrer();                 // version en ligne : donnees du Drive
  main().innerHTML = '<p class="message">Aucune donnée.</p>';
})();
